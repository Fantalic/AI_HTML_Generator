<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@2.8.2/dist/alpine.min.js" defer></script>
    <style>
        #container *:not(#container) {
            cursor: pointer;
            transition: background-color 0.3s, outline 0.3s;
        }

        #container *:not(#container):hover {
            background-color: lightgray;
            outline: 1px dashed gray;
        }
    </style>
</head>
<body>
<div
    class="bg-indigo-100 w-screen h-screen"
    x-data="initData()"
>
    <div
        class="container mx-auto px-4 py-8 max-w-4xl "
    >
        <h1 class="text-3xl font-bold mb-8 text-center">AI HTML Generator</h1>

        <form id="searchForm" @submit.prevent="handleSubmit">
            <div class="mb-8">
                <input
                    class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:border-blue-500"
                    x-model="prompt"
                    type="text"
                    id="searchInput"
                >
            </div>

            <button
                id="generateHTMLsubmitBtn"
                type="submit"
                class="w-full bg-blue-500 text-white py-3 px-4 rounded-lg hover:bg-blue-600 transition-colors duration-200"
            >
                Generate HTML
            </button>
        </form>
    </div>

    <div
        class="html-container relative mt-8 bg-white border-2 border-dashed border-gray-300 "
    >
        <div
            id="loader"
            x-cloak
            x-show="loading"
            class="loader w-10 h-10 border-4 border-blue-400 border-solid border-t-transparent rounded-full animate-spin mx-auto my-4"
        ></div>
        <div
            x-show="!loading"
            id="container"
            @click="editHTML"
            x-html="htmlContent"
        >
            <div class="rounded-lg p-8 text-center">
                Your Generated HTML Here
            </div>
        </div>
    </div>
    <div
        id="code-container"
        class="mt-8 bg-gray-100 border-2 border-dashed border-gray-300 p-4 flex flex-col justify-between">
        <pre >
            <code
                id="html-code"
                x-text="htmlContent"
                @click="editCode($event)"
                @blur="htmlContent = $event.target.innerText"
            ></code>
        </pre>

        <button
            class="mt-4 px-4 py-2 bg-green-500 hover:bg-green-700 text-white rounded self-end"
            @click="showModal = true"
        >
            Save
        </button>
    </div>

    <div
        id="fileModal"
        class=" fixed inset-0 flex items-center justify-center"
        x-cloak
        x-show="showModal"
    >
        <div class="bg-white p-6 rounded-lg shadow-lg w-80">
            <h3 class="text-lg font-semibold mb-3">Enter File Name</h3>
            <input type="text" id="fileNameInput" class="w-full p-2 border rounded-md focus:ring focus:ring-blue-300" placeholder="example.html">
            <div class="flex justify-end space-x-2 mt-4">
                <button  @click="showModal = false" class="px-4 py-2 bg-gray-400 text-white rounded-md hover:bg-gray-500" >Cancel</button>
                <button  @click="saveFile" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700" >Save</button>
            </div>
        </div>
    </div>


    <script >
        function extractHtmlBlock(inputString) {
            const regex = /```html\s*([\s\S]*?)```/g;
            let matches = [];
            let match;

            while ((match = regex.exec(inputString)) !== null) {
                matches.push(match[1].trim());
            }

            if (matches.length === 0) {
                return inputString
            }
            return matches;
        }

        // ALPINE COMPONENT:
        function handleSubmit(e) {
            console.log("handle submit")
            e.preventDefault();

            const searchTerm = this.prompt
            console.log(searchTerm)
            if (!searchTerm) return;

            const old_html = this.htmlContent
            this.loading = true

            fetch('/create_html', {
                method: 'POST',
                body: JSON.stringify({
                    prompt: searchTerm,
                    html:old_html
                }),
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                html = extractHtmlBlock(data.html)
                //console.log("HTML RESPONSE : ")
                //console.log(html)
                this.htmlContent = html

            })
            .catch(error => {
                console.error('Error fetching data:', error);
                this.htmlContent = '<p class="text-red-500">Error generating HTML. Please try again.</p>';
            })
            .finally(() => {
                this.loading = false
            })
        }


        function editCode(event) {
            const codeElement = event.target;
            // Toggle contenteditable when clicked
            codeElement.contentEditable = codeElement.contentEditable === "true" ? "false" : "true";
            codeElement.focus();
        }

        async function save_file() {
            const file_name = document.getElementById('fileNameInput').value
            const content = this.htmlContent
            const blob = new Blob([content], { type: 'text/plain' });

            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = file_name; // Default file name; users can change it in the dialog
            document.body.appendChild(a);
            a.click();

            // Clean up
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            this.showModal = false
        }

        function editHTML(event) {
            const container = document.getElementById("container");
            let target = event.target;

            // Ensure the clicked element is inside the container
            if (target !== container) {
                target.setAttribute("contenteditable", "true");
                target.focus();

                target.addEventListener('blur', () => {
                    this.htmlContent = document.getElementById('container').innerHTML;
                });
            }
        }

        const data  = {
            init(){
                console.log("INIT ALPINE !")

                // Listen for clicks outside the container
                document.addEventListener("click", function(event) {
                    if (!container.contains(event.target)) {
                        let editableElements = container.querySelectorAll("[contenteditable='true']");
                        editableElements.forEach(el => el.removeAttribute("contenteditable"));
                    }
                });
            },
            test:" this is a test",
            loading:false,
            showModal:false,
            htmlContent: '<div class="rounded-lg p-8 text-center">Your Generated HTML Here</div>',
            prompt:"type your prompt here",
            handleSubmit,
            saveFile:save_file,
            editHTML
        }

        function initData(){
            return data
        }

    </script>
</div>
</body>
</html>
