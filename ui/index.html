<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI HTML Generator</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/src/styles/main.css" />
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <div x-data="appState()" class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">
    <!-- Login -->
    <div x-show="!$store.app.authenticated" class="flex min-h-screen flex-col justify-center px-6 py-12 lg:px-8">
      <div x-data="loginForm()" class="sm:mx-auto sm:w-full sm:max-w-sm">
        <template x-if="error">
          <p class="text-red-500 text-sm text-center mb-4" x-text="error"></p>
        </template>
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 mb-4">
            <span class="text-2xl text-white font-bold">&lt;/&gt;</span>
          </div>
          <h2 class="text-2xl font-bold text-gray-900">AI HTML Generator</h2>
          <p class="text-sm text-gray-500 mt-1">Sign in to continue</p>
        </div>
        <form @submit.prevent="handleLogin" class="space-y-5">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" x-model="email" id="email" required
              class="mt-1 block w-full rounded-lg bg-white px-4 py-2.5 text-sm text-gray-900 border border-gray-300 placeholder:text-gray-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all">
          </div>
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" x-model="password" id="password" required
              class="mt-1 block w-full rounded-lg bg-white px-4 py-2.5 text-sm text-gray-900 border border-gray-300 placeholder:text-gray-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all">
          </div>
          <button type="submit"
            class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all">
            Sign in
          </button>
        </form>
      </div>
    </div>

    <!-- Main App -->
    <div x-show="$store.app.authenticated" class="flex flex-col min-h-screen">
      <!-- Header -->
      <header class="bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center">
              <span class="text-xs text-white font-bold">&lt;/&gt;</span>
            </div>
            <span class="font-semibold text-gray-800">AI HTML Generator</span>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-xs text-gray-400 hidden sm:inline">Connected</span>
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
          </div>
        </div>
      </header>

      <!-- Main Content -->
      <main x-data="htmlEditor()" class="flex-1 max-w-5xl mx-auto w-full px-4 sm:px-6 py-6 space-y-5">
        <!-- Prompt Section -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
          <form @submit.prevent="handleSubmit">
            <div class="flex gap-3">
              <input x-model="prompt" type="text" placeholder="Describe the HTML you want to generate..."
                class="flex-1 rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all placeholder:text-gray-400">
              <button type="submit" :disabled="loading"
                class="rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-2 whitespace-nowrap">
                <span x-show="!loading">Generate</span>
                <span x-show="loading" class="inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                <span x-show="loading">Generating...</span>
              </button>
            </div>
          </form>
        </div>

        <!-- Preview & Code -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
          <!-- Toolbar -->
          <div class="flex items-center justify-between px-5 py-3 border-b border-gray-100 bg-gray-50/50">
            <div class="flex items-center gap-2">
              <div class="w-3 h-3 rounded-full bg-rose-400"></div>
              <div class="w-3 h-3 rounded-full bg-amber-400"></div>
              <div class="w-3 h-3 rounded-full bg-emerald-400"></div>
              <span class="text-xs text-gray-400 ml-2 font-medium">Preview</span>
            </div>
            <div class="flex items-center gap-2">
              <button @click="showCode = !showCode"
                class="text-xs px-3 py-1.5 rounded-md border border-gray-200 bg-white text-gray-600 hover:bg-gray-100 hover:text-gray-800 transition-all font-medium flex items-center gap-1.5">
                <span x-text="showCode ? 'Hide' : 'Show'"></span>
                <span>&lt;/&gt;</span>
              </button>
              <div x-data="fileSaver()">
                <button @click="showModal = true"
                  class="text-xs px-3 py-1.5 rounded-md bg-indigo-600 text-white hover:bg-indigo-500 transition-all font-medium">
                  Save
                </button>
                <!-- Save Modal -->
                <div x-show="showModal" x-cloak
                  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm"
                  @click.outside="showModal = false">
                  <div class="bg-white rounded-xl shadow-xl w-80 p-6" @click.stop>
                    <h3 class="text-base font-semibold text-gray-900 mb-1">Save File</h3>
                    <p class="text-xs text-gray-500 mb-4">Enter a filename for your HTML file.</p>
                    <input type="text" x-model="fileName"
                      class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all"
                      placeholder="index.html">
                    <div class="flex justify-end gap-2 mt-5">
                      <button @click="showModal = false"
                        class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 font-medium transition-all">Cancel</button>
                      <button @click="saveFile"
                        class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-500 font-medium transition-all">Save</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Preview Area -->
          <div class="relative">
            <div x-show="loading" class="flex items-center justify-center py-20">
              <div class="w-8 h-8 border-3 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
            </div>
            <div x-show="!loading" id="container" @click="editHTML"
              x-html="$store.app.htmlContent"
              class="p-6 min-h-[260px] cursor-pointer"></div>
          </div>

        </div>

        <!-- Quick Tips -->
        <div class="text-center text-xs text-gray-400 pt-1">
          Click on any element in the preview to edit it directly
        </div>

        <!-- Code Editor Overlay -->
        <div x-show="showCode" x-cloak
          x-transition:enter="transform transition ease-out duration-300"
          x-transition:enter-start="translate-y-full"
          x-transition:enter-end="translate-y-0"
          x-transition:leave="transform transition ease-in duration-200"
          x-transition:leave-start="translate-y-0"
          x-transition:leave-end="translate-y-full"
          class="fixed bottom-0 left-0 right-0 z-40 flex flex-col bg-[#1e1e2e] rounded-t-2xl shadow-lg"
          style="height: 40vh;">
          <!-- Handle -->
          <div class="flex items-center justify-between px-5 py-3 bg-[#181825] rounded-t-2xl border-b border-[#313244] shrink-0">
            <div class="flex items-center gap-3">
              <div @click="showCode = false"
                class="w-8 h-8 rounded-lg bg-[#313244] flex items-center justify-center hover:bg-[#45475a] cursor-pointer transition-colors">
                <svg class="w-4 h-4 text-[#cdd6f4]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
              </div>
              <span class="text-sm font-medium text-[#cdd6f4]">Code Editor</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs text-[#6c7086]">click code to edit</span>
              <button @click="showCode = false"
                class="w-7 h-7 rounded-lg bg-[#313244] flex items-center justify-center hover:bg-[#45475a] cursor-pointer transition-colors">
                <svg class="w-4 h-4 text-[#cdd6f4]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
          </div>
          <!-- Code Content -->
          <div class="flex-1 overflow-auto p-5">
            <pre class="text-sm font-mono leading-relaxed h-full"><code id="html-code"
              @click="editCode"
              @blur="$store.app.htmlContent = $event.target.innerText"
              class="text-[#cdd6f4] outline-none block min-h-full whitespace-pre-wrap break-all"
              x-text="$store.app.htmlContent"></code></pre>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
