[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_creature_generator"
version = "0.1.0"
description = "AI-powered HTML generator using local Ollama models"
readme = "README.md"
authors = [
    { name = "Your Name" },
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
]

[project.urls]
Homepage = "https://github.com/your-username/ai_creature_generator"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_creature_generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
